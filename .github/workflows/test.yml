name: Tests

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Create environment file
        run: cp .env.example .env

      - name: Generate Prisma client
        run: npm run db:generate

      - run: npm run build

      - run: npm test
